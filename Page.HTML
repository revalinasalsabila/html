<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connect App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 200px;
      background: #faf8f8;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar h2 {
      margin: 0 0 20px 0;
      color: #fff;
    }

    .sidebar button {
      background: #fff;
      border: none;
      padding: 10px;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      border-radius: 5px;
      color: #000;
      transition: background 0.2s;
    }

    .sidebar button.active {
      background: #000;
      color: #fff;
      font-weight: bold;
      border: 2px solid #fff;
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
      position: relative;
    }

    .search-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-card {
      background: #fff;
      padding: 15px;
      border-left: 4px solid #ccc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .badges {
      margin-top: 5px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 12px;
      margin-right: 5px;
      border-radius: 4px;
      color: white;
    }

    .badge.admin {
      background-color: #333;
    }

    .badge.employee {
      background-color: #555;
    }

    .status {
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }

    .status.active {
      color: green;
      font-weight: bold;
    }

    .status.suspended {
      color: red;
      font-weight: bold;
    }

    .add-button {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #ccc;
      border: none;
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2 style="color: #000;">Connect</h2>
      <button class="active">User</button>
      <button>Hak Akses</button>
      <button>Logout</button>
    </aside>

    <main class="main-content">
      <input type="text" placeholder="Cari user" class="search-box" />

      <div class="user-list">
        <div class="user-card">
          <div class="user-info">
            <strong>Revalina Salsabila</strong>
            <small>2313054@students.universitasmulia.ac.id</small>
            <div class="badges">
              <span class="badge admin">Admin</span>
              <span class="badge employee">Employee</span>
            </div>
          </div>
          <div>
            <span class="status active">Aktif</span>
          </div>
        </div>

        <div class="user-card">
          <div class="user-info">
            <strong>Lintang</strong>
            <small>lintang@universitasmulia.ac.id</small>
            <div class="badges">
              <span class="badge employee">Employee</span>
            </div>
          </div>
          <div>
            <span class="status active">Aktif</span>
          </div>
        </div>

        <div class="user-card">
          <div class="user-info">
            <strong>Shafira</strong>
            <small>shafira@universitasmulia.ac.id</small>
            <div class="badges">
              <span class="badge employee">Employee</span>
            </div>
          </div>
          <div>
            <span class="status active">Aktif</span>
          </div>
        </div>

        <div class="user-card">
          <div class="user-info">
            <strong>Lebah Ganteng</strong>
            <small>lebahganteng@universitasmulia.ac.id</small>
            <div class="badges">
              <span class="badge employee">Employee</span>
            </div>
          </div>
          <div>
            <span class="status suspended">Suspended</span>
          </div>
        </div>
      </div>

      <button class="add-button">+</button>
    </main>
  </div>
</body>
</html>
