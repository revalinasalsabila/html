<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connect App</title>
  <!-- Link Font Awesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #fff;
      border-right: 1px solid #000; /* Garis pemisah */
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
    }

    .sidebar h2 {
      color: #000;
      margin-bottom: 40px;
    }

    .nav-button {
      width: 100%;
      background-color: #fff;
      border: none;
      padding: 15px 20px;
      text-align: left;
      font-size: 16px;
      color: #000;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .nav-button i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    .nav-button.active {
      background-color: #000;
      color: #fff;
    }

    /* Konten Utama */
    .main-content {
      flex: 1;
      padding: 20px;
      background-color: #f4f4f4;
    }

    .search-box {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .user-card {
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-info strong {
      margin-bottom: 5px;
    }

    .badges {
      margin-top: 5px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 12px;
      margin-right: 5px;
      border-radius: 4px;
      color: #fff;
      background-color: #000;
    }

    .status {
      font-size: 14px;
      font-weight: bold;
      color: #000;
    }

    .add-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #ccc;
      border: none;
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2>Connect</h2>
    <button class="nav-button active"><i class="fas fa-user"></i>User</button>
    <button class="nav-button"><i class="fas fa-user-gear"></i>Hak Akses</button>
    <button class="nav-button"><i class="fas fa-right-from-bracket"></i>Logout</button>
  </aside>

  <main class="main-content">
    <input type="text" class="search-box" placeholder="Cari user" />

    <div class="user-card">
      <div class="user-info">
        <strong>Rahmat Saudi Al Fathir As</strong>
        <small>rahmatsaudi@universitasmulia.ac.id</small>
        <div class="badges">
          <span class="badge">Admin</span>
          <span class="badge">Employee</span>
        </div>
      </div>
      <div class="status">Aktif</div>
    </div>

    <div class="user-card">
      <div class="user-info">
        <strong>Lintang</strong>
        <small>lintang@universitasmulia.ac.id</small>
        <div class="badges">
          <span class="badge">Employee</span>
        </div>
      </div>
      <div class="status">Aktif</div>
    </div>

    <div class="user-card">
      <div class="user-info">
        <strong>Shafira</strong>
        <small>shafira@universitasmulia.ac.id</small>
        <div class="badges">
          <span class="badge">Employee</span>
        </div>
      </div>
      <div class="status">Aktif</div>
    </div>

    <div class="user-card">
      <div class="user-info">
        <strong>Lebah Ganteng</strong>
        <small>lebahganteng@universitasmulia.ac.id</small>
        <div class="badges">
          <span class="badge">Employee</span>
        </div>
      </div>
      <div class="status">Suspended</div>
    </div>

    <button class="add-button">+</button>
  </main>
</body>
</html>
